name: Build MkulimaCollect Android

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-mkulimacollect-android.yml"
      - "apps/collect/**"

jobs:
  android-debug-apk:
    name: Android debug APK
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash

    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        working-directory: apps/collect
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        working-directory: apps/collect
        run: npm run typecheck

      - name: Generate Android project
        working-directory: apps/collect
        run: npx expo prebuild --platform android

      - name: Build debug APK
        working-directory: apps/collect/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: MkulimaCollect-debug-apk
          path: apps/collect/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
