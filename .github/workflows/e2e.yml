name: E2E Tests

on:
  workflow_dispatch:
  push:
    branches: [main, master]
    paths:
      - ".github/workflows/e2e.yml"
      - "apps/collect/**"

jobs:
  mobile-flow-smoke:
    name: Mobile collection flow smoke
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: apps/collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck collection flow
        run: npm run typecheck

      - name: Generate native project
        run: npx expo prebuild --platform android

      - name: Verify generated Android project
        run: |
          test -f android/app/build.gradle
          test -f android/app/src/main/AndroidManifest.xml
          test -f android/app/src/main/assets/index.android.bundle || echo "Release workflow embeds the JS bundle during assembleRelease."
