name: Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*.*.*"

jobs:
  release-checks:
    name: Release quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: apps/collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        uses: ncipollo/release-action@v1
        with:
          tag: ${{ github.ref_name }}
          name: MkulimaCollect ${{ github.ref_name }}
          body: "Mobile release checks passed. Use the Preview APK workflow for internal installable APK artifacts and EAS/Play signing for store distribution."
