name: Build MkulimaCollect Preview APK

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "apps/collect/**"
      - ".github/workflows/build-mkulimacollect-preview-apk.yml"

permissions:
  contents: write

jobs:
  android-preview-apk:
    name: Android standalone preview APK
    runs-on: ubuntu-latest

    env:
      CI: true
      EXPO_NO_TELEMETRY: "1"
      EXPO_PUBLIC_ENVIRONMENT: "preview"
      EXPO_PUBLIC_API_BASE_URL: "https://staging-api.mkulimascore.com"

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app dependencies
        working-directory: apps/collect
        shell: bash
        run: npm ci --legacy-peer-deps

      - name: Remove development client for preview binary
        working-directory: apps/collect
        shell: bash
        run: |
          node -e "const fs=require('fs'); const p='package.json'; const pkg=JSON.parse(fs.readFileSync(p,'utf8')); if (pkg.dependencies) delete pkg.dependencies['expo-dev-client']; fs.writeFileSync(p, JSON.stringify(pkg,null,2));"
          rm -rf node_modules/expo-dev-client node_modules/expo-dev-launcher node_modules/expo-dev-menu node_modules/expo-dev-menu-interface
          if [ -d node_modules/expo-dev-client ]; then
            echo "expo-dev-client is still present; refusing to build a dev-client preview APK."
            exit 1
          fi
          echo "expo-dev-client removed from the preview build workspace."

      - name: Generate Android project
        working-directory: apps/collect
        shell: bash
        run: npx expo prebuild --platform android --clean --no-install

      - name: Build release APK
        timeout-minutes: 45
        working-directory: apps/collect/android
        shell: bash
        run: |
          chmod +x gradlew
          if grep -q "^reactNativeArchitectures=" gradle.properties; then
            sed -i "s/^reactNativeArchitectures=.*/reactNativeArchitectures=arm64-v8a/" gradle.properties
          else
            echo "reactNativeArchitectures=arm64-v8a" >> gradle.properties
          fi
          ./gradlew --no-daemon --stacktrace :app:assembleRelease

      - name: Sign preview APK
        working-directory: apps/collect/android
        shell: bash
        run: |
          release_dir="app/build/outputs/apk/release"
          input_apk="$(find "$release_dir" -maxdepth 1 -type f -name "*.apk" | sort | head -n 1)"
          aligned_apk="$RUNNER_TEMP/MkulimaCollect-preview-aligned.apk"
          signed_apk="app/build/outputs/apk/release/MkulimaCollect-preview.apk"
          zipalign="$(find "$ANDROID_HOME/build-tools" -name zipalign | sort -V | tail -n 1)"
          apksigner="$(find "$ANDROID_HOME/build-tools" -name apksigner | sort -V | tail -n 1)"

          if [ -z "$input_apk" ]; then
            echo "No release APK found in $release_dir"
            exit 1
          fi

          keytool -genkeypair \
            -keystore "$RUNNER_TEMP/mkulimacollect-preview.jks" \
            -storepass preview-store-password \
            -keypass preview-store-password \
            -alias mkulimacollect-preview \
            -keyalg RSA \
            -keysize 2048 \
            -validity 3650 \
            -dname "CN=MkulimaCollect Preview,O=MkulimaScore,C=KE"

          echo "Signing preview APK from: $input_apk"
          "$zipalign" -p -f 4 "$input_apk" "$aligned_apk"
          "$apksigner" sign \
            --ks "$RUNNER_TEMP/mkulimacollect-preview.jks" \
            --ks-key-alias mkulimacollect-preview \
            --ks-pass pass:preview-store-password \
            --key-pass pass:preview-store-password \
            --out "$signed_apk" \
            "$aligned_apk"
          "$apksigner" verify --verbose "$signed_apk"
          ls -lh "$signed_apk"

      - name: Report preview binary
        working-directory: apps/collect
        shell: bash
        run: |
          echo "Standalone preview APK: android/app/build/outputs/apk/release/MkulimaCollect-preview.apk"
          echo "expo-dev-client included in preview binary: no"

      - name: Upload preview APK
        uses: actions/upload-artifact@v4
        with:
          name: MkulimaCollect-preview-apk
          path: apps/collect/android/app/build/outputs/apk/release/MkulimaCollect-preview.apk
          if-no-files-found: error

      - name: Commit staging preview APK
        shell: bash
        run: |
          set -euo pipefail
          apk_src="apps/collect/android/app/build/outputs/apk/release/MkulimaCollect-preview.apk"
          cp "$apk_src" "$RUNNER_TEMP/MkulimaCollect-preview.apk"
          git reset --hard HEAD
          git clean -fd
          mkdir -p artifacts
          cp "$RUNNER_TEMP/MkulimaCollect-preview.apk" artifacts/MkulimaCollect-preview.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add artifacts/MkulimaCollect-preview.apk
          if git diff --cached --quiet; then
            echo "Preview APK is unchanged."
            exit 0
          fi
          git commit -m "Update the tracked staging preview APK."
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push origin "HEAD:${GITHUB_REF_NAME}"
