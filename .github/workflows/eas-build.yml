name: EAS Build

on:
  workflow_dispatch:

jobs:
  eas-build:
    name: Optional EAS cloud build
    runs-on: ubuntu-latest
    env:
      EAS_TOKEN: ${{ secrets.EAS_TOKEN }}

    defaults:
      run:
        shell: bash
        working-directory: apps/collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Install EAS CLI
        run: npm install --global eas-cli

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Android preview with EAS
        env:
          EAS_NON_INTERACTIVE: "1"
        run: |
          if [ -z "$EAS_TOKEN" ]; then
            echo "EAS_TOKEN is not configured; skipping optional EAS cloud build."
            exit 0
          fi

          eas build --platform android --profile preview --non-interactive
