name: CI

on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  mobile-quality:
    name: Mobile quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: apps/collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm run test:ci

      - name: Validate Expo config
        run: npx expo config --type public

  ingestion-pipeline:
    name: Ingestion pipeline
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install and test ingestion service
        working-directory: services/ingestion
        run: |
          python -m pip install -r requirements.txt
          python -m pytest tests -q
