name: CI

on:
  workflow_dispatch:

jobs:
  mobile-quality:
    name: Mobile quality gate
    runs-on: ubuntu-latest

    defaults:
      run:
        shell: bash
        working-directory: apps/collect

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          lfs: true

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/collect/package-lock.json

      - name: Install app dependencies
        run: npm ci --legacy-peer-deps

      - name: Typecheck
        run: npm run typecheck

      - name: Validate Expo config
        run: npx expo config --type public
